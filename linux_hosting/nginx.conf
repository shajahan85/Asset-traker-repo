# Nginx configuration for Asset Tracker Django application
# Place this file in /etc/nginx/sites-available/asset_tracker
# Then create symlink: sudo ln -s /etc/nginx/sites-available/asset_tracker /etc/nginx/sites-enabled/

upstream asset_tracker_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name your_domain.com www.your_domain.com;  # Change this to your domain or IP
    
    client_max_body_size 10M;
    
    # Logging
    access_log /var/log/nginx/asset_tracker_access.log;
    error_log /var/log/nginx/asset_tracker_error.log;
    
    # Static files
    location /static/ {
        alias /var/www/asset_tracker/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Media files
    location /media/ {
        alias /var/www/asset_tracker/media/;
        expires 7d;
    }
    
    # Main application
    location / {
        proxy_pass http://asset_tracker_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

